<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remote Controller</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #status-bar {
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .indicator {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e53e3e;
        }

            .indicator.connected {
                background: #38a169;
                box-shadow: 0 0 8px #38a169;
            }

        .container {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .text-box-container {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        #text-input {
            flex: 1;
            padding: 12px 14px;
            background: #202024;
            border: 2px solid #323238;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

            #text-input:focus {
                border-color: #00b37e;
            }

        .send-btn {
            padding: 0 16px;
            background: #00875f;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .row {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        button.key {
            flex: 1;
            height: 52px;
            background: #202024;
            color: #e1e1e6;
            border: 2px solid #323238;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px #121214;
            transition: background 0.05s, transform 0.05s;
        }

            button.key:active, button.key.active {
                background: #00875f;
                border-color: #00b37e;
                transform: translateY(2px);
                box-shadow: 0 1px #121214;
            }

        .empty {
            flex: 1;
            height: 52px;
            visibility: hidden;
        }

        .system-key {
            background: #29292e;
        }
    </style>
</head>
<body>
    <div id="status-bar">
        <div id="dot" class="indicator"></div>
        <span id="status-text">Connecting...</span>
    </div>

    <div class="container">
        <form id="text-form" class="text-box-container" onsubmit="event.preventDefault(); sendText();">
            <input type="text" id="text-input" placeholder="Enter text..." autocomplete="off">
            <button type="submit" class="send-btn">Enter</button>
        </form>

        <div class="grid">
            <div class="row">
                <button class="key" data-key="INSERT">Insert</button>
                <button class="key" data-key="HOME">Home</button>
            </div>
            <div class="row">
                <button class="key system-key" data-key="MENU">Alt</button>
                <button class="key system-key" data-key="TAB">Tab</button>
                <button class="key system-key" data-key="ESCAPE">Esc</button>
            </div>
            <div class="row">
                <button class="key system-key" data-key="SHIFT">Shift</button>
                <button class="key system-key" data-key="BACK">⌫ Back</button>
                <button class="key system-key" data-key="RETURN">⏎ Enter</button>
            </div>
            <div class="row" style="margin-top: 8px;">
                <div class="empty"></div>
                <button class="key" data-key="UP">▲</button>
                <div class="empty"></div>
            </div>
            <div class="row">
                <button class="key" data-key="LEFT">◀</button>
                <button class="key" data-key="DOWN">▼</button>
                <button class="key" data-key="RIGHT">▶</button>
            </div>
        </div>
    </div>

    <script>
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('status-text');
        const textInput = document.getElementById('text-input');

        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${location.host}/ws`;

        let ws;

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                dot.classList.add('connected');
                statusText.innerText = 'Connected to PC';
            };
            ws.onclose = () => {
                dot.classList.remove('connected');
                statusText.innerText = 'Connection lost. Reconnecting...';
                setTimeout(connect, 1500);
            };
            ws.onerror = () => ws.close();
        }

        connect();

        function sendCommand(action, key) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action, key }));
            }
        }

        function sendText() {
            const val = textInput.value;
            if (!val) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "text", value: val }));
                textInput.value = '';
            }
        }

        document.querySelectorAll('.key').forEach(button => {
            const key = button.getAttribute('data-key');
            const handleDown = (e) => {
                e.preventDefault();
                button.classList.add('active');
                sendCommand('down', key);
            };
            const handleUp = (e) => {
                e.preventDefault();
                button.classList.remove('active');
                sendCommand('up', key);
            };

            button.addEventListener('touchstart', handleDown, { passive: false });
            button.addEventListener('touchend', handleUp, { passive: false });
            button.addEventListener('touchcancel', handleUp, { passive: false });
            button.addEventListener('mousedown', handleDown);
            button.addEventListener('mouseup', handleUp);
            button.addEventListener('mouseleave', handleUp);
        });
    </script>
</body>
</html>
